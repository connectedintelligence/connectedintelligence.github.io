{{ $data := site.Data }}

{{ with $data.homepage.success_story }}
<section class="section bg-cover" data-background="{{ .bg_image | absURL }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-6 col-sm-4 position-relative success-video">
        <a class="play-btn venobox" href="{{ .video_link | safeURL }}" data-vbtype="video">
          <i class="ti-control-play"></i>
        </a>
      </div>
      <div class="col-lg-6 col-sm-8">
        <div class="bg-white p-5">
          <h2 class="section-title">{{ .title | markdownify }}</h2>
          <div>{{ .content | markdownify }}</div>
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}

{{ with site.Data.homepage.success_story.themes }}
<div class="row justify-content-center my-4">
  {{ range . }}
  <div class="col-md-3 col-6 mb-4">
    <div class="card h-100 text-center shadow feature-card">
      <div class="card-body">
        <!-- Icon: emoji, SVG, or FontAwesome -->
        <div class="feature-icon mb-3" style="font-size: 2.5rem;">
          {{ .icon }}
        </div>
        <h5 class="card-title">{{ .title }}</h5>
        <p class="card-text">{{ .desc }}</p>
      </div>
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
