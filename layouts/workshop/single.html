{{ define "main" }}

<!-- notice details -->
<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 mx-auto">
        <div class="mb-4 pb-3 border-bottom">
          <h2 class="mb-2">{{ .Title }}</h2>
          <p class="text-muted mb-0">{{ .Date.Format "January 2, 2006" }}</p>
        </div>
        <div class="content">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>
</section>
<!-- /notice details -->

{{ end }}
