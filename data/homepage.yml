    link : "/"

######################## Success story #############################
success_story:
  enable: true
  bg_image: "images/backgrounds/success-story.jpg"
  title: "Research Themes"
  content: "At TICI, faculty, students, and researchers collaborate on cutting-edge theoretical and applied research in the following areas:"
  themes:
    - icon: '<i class="ti-mobile"></i>'
      title: "Next-Generation Communications"
      desc: "6G, Open RAN, NTN"
    - icon: '<i class="ti-settings"></i>'
      title: "Robotics and Autonomy"
      desc: "Smart, adaptive machines for the future."
    - icon: '<i class="ti-light-bulb"></i>'
      title: "Artificial Intelligence"
      desc: "Theoretical foundations, Generative AI, and AI-driven insights"
    - icon: '<i class="ti-shield"></i>'
      title: "System Security"
      desc: "Protecting data and infrastructure."

  video_link : "https://www.youtube.com/watch?v=auUnazOFeeE"


