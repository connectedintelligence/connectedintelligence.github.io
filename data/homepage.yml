################################# Slider #####################################
slider:
  enable : true
  bg_image : "images/banner/istockphoto-1222629933-612x612.jpg"
  slider_item:
    # slider item loop
    - title : "Texas A&M Initiative for Connected Intelligence"
      content : |
        We are planning the technological foundations for 
        next-generation physical intelligence, 
        enabling collaborative, networked agents to operate across domains.
      animation_in : "left"
      animation_out : "right"
      # available animation : left, right, up, down
      button:
        enable : true
        label : "Learn More"
        link : "/"

    # slider item loop
    - title : "Cross-Disciplinary Collaboration"
      content : |
        TICI brings together 20 faculty members and more than 50 students from electrical engineering, 
        computer science, mechanical and aerospace engineering, and industrial 
        technology—uniting AI, robotics, networking, and systems.
      animation_in : "left"
      animation_out : "right"
      # available animation : left, right, up, down
      button:
        enable : true
        label : "Learn More"
        link : "/"

    # slider item loop
    - title : "Core Areas of Research"
      content : |
        - Next-Generation Communications
        - Robotics and Autonomy
        - Foundations and Applications of Artificial Intelligence
        - System Security
      animation_in : "left"
      animation_out : "right"
      # available animation : left, right, up, down
      button:
        enable : true
        label : "Learn More"
        link : "/"


############################## about ##################################
about:
  enable : true
  title : "Our Mission"
  images:
    - "images/about/banner-1.jpg"
    - "images/about/ApplicationawareORAN.png"
    - "images/about/srikanthimageexample.jpg"
    - "images/about/swarm.jpg"
    - "images/about/Aggiebots-p1.jpg"
    - "images/about/ZACH-exterior-2.jpg"
  content : "Connected intelligent systems, supported over NextG communication and distributed compute are key to the next societal transformation. These systems include edge/cloud-supported robotics, augmented reality/virtual reality, Chat/CodeBots based on large language models, and real time media, which promise to revolutionize logistics, manufacturing, infrastructure, healthcare, education, and entertainment. This revolution will critically depend on the three key innovation areas of (i) empirical and foundational work in machine learning, (ii) NextG wireless and compute systems, and (iii) sensing and communication systems with on-board intelligence. This initiative brings together faculty, students, and researchers across the Texas A&M University community to enable collaborative research and attain primacy in connected intelligent systems"
  button:
    enable : true
    label : "Learn more"
    link : "/"

